version: "3.9"

services:
  # Path Service Database
  path-db:
    image: postgres:15-alpine
    container_name: path-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: path_service_db
    volumes:
      - path_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Exposed on 5433 to avoid conflict with default Postgres
    networks:
      - path-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Path Service Application
  path-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: path-service
    env_file:
      - .env.docker
    ports:
      - "8006:8006"
    depends_on:
      path-db:
        condition: service_healthy
    networks:
      - path-net
    extra_hosts:
      - "host.docker.internal:host-gateway" # Allows connecting to other microservices on host

volumes:
  path_db_data:

networks:
  path-net:
    driver: bridge
